<div id="splash" role="status" aria-label="Carregando"><div class="sp-in"><div id="splashArt"></div><div class="logo sp-logo">New<em>Life</em></div><div class="sp-bar"><i></i></div><p class="sp-tip">Sorteando uma nova vida…</p></div></div>
<div id="app">
  <button id="newsBar" aria-label="Abrir jornal de notícias"></button>
  <header id="hdr">
    <button class="icon-btn" id="menuBtn" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="avatar" id="avatar"></div>
    <div class="who"><div id="hName"></div><div id="hSub"></div></div>
    <div class="cash"><div id="hMoney"></div><div class="lbl">Saldo</div></div>
  </header>
  <main id="log" aria-live="polite"></main>
  <section id="stats" aria-label="Atributos"></section>
  <nav id="nav">
    <button id="nCareer"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><span>Carreira</span></button>
    <button id="nAssets"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Bens</span></button>
    <button id="nAge" class="age" aria-label="Envelhecer um ano"><div class="plus">🎂</div><span>Envelhecer</span></button>
    <button id="nRel"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9-9a4.6 4.6 0 0 1 9-2 4.6 4.6 0 0 1 9 2c-2 4.6-9 9-9 9z"/></svg><span>Relações</span></button>
    <button id="nAct"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/></svg><span>Atividades</span></button>
  </nav>
</div>
<div id="sheetWrap" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <button class="icon-btn" id="sheetBack" aria-label="Voltar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" id="sheetClose" aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div id="modalWrap" class="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="gameWrap" class="overlay" hidden><div class="modal game" id="game" role="dialog" aria-modal="true"></div></div>
<div id="start" class="full" hidden></div>
<div id="death" class="full" hidden></div>
<div id="err" hidden></div>
